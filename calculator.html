<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoC Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #333;
      color: whitesmoke;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    h1 {
      margin-bottom: 1rem;
    }

    form {
      background-color: #555;
      color: whitesmoke;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding: 1rem;
      border-radius: 8px;
    }

    input {
      padding: 0.5rem;
      font-size: 1rem;
    }

    button {
      background-color: rgb(25, 25, 255);
      color: whitesmoke;
      border: none;
      padding: 0.5rem 1rem;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background-color: rgb(50, 50, 255);
    }

    table {
      border-collapse: collapse;
      width: 90%;
      max-width: 700px;
      background: whitesmoke;
      color: #555;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 0.75rem;
      text-align: center;
    }

    th {
      background-color: #f1f1f1;
    }

    tbody tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    .ratio {
      color: #555;
      font-weight: bold;
    }

    .btn-small {
      padding: 0.3rem 0.6rem;
      font-size: 0.9rem;
      border-radius: 4px;
      margin: 0 0.2rem;
    }

    .btn-edit {
      background-color: #ffc107;
      color: #222;
    }

    .btn-edit:hover {
      background-color: #e0a800;
    }

    .btn-delete {
      background-color: #dc3545;
      color: white;
    }

    .btn-delete:hover {
      background-color: #b02a37;
    }
  </style>
</head>

<body>
  <h1>Lista Miglioramenti</h1>

  <form id="todoForm">
    <input type="text" id="nome" placeholder="Nome" required />
    <input type="number" id="costo" placeholder="Costo" required min="1" />
    <input type="number" id="tempo" placeholder="(h) Tempo Miglioramento" required min="1" />
    <button type="submit">Aggiungi</button>
  </form>

  <table id="todoTable">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Costo</th>
        <th>Tempo Miglioramento</th>
        <th>Rapporto (Costo/Tempo)</th>
        <th>Azioni</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const form = document.getElementById('todoForm');
    const tbody = document.querySelector('#todoTable tbody');
    const STORAGE_KEY = 'coc_items';

    let items = [];
    let editIndex = null;

    // --- Carica dati dal localStorage all'avvio ---
    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        items = JSON.parse(saved);
        renderTable();
      }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const nome = document.getElementById('nome').value.trim();
      const costo = parseFloat(document.getElementById('costo').value);
      const tempo = parseFloat(document.getElementById('tempo').value);

      if (!nome || isNaN(costo) || isNaN(tempo) || costo <= 0 || tempo <= 0) {
        alert("Per favore inserisci valori validi!");
        return;
      }

      const rapporto = costo / tempo;

      if (editIndex !== null) {
        items[editIndex] = { nome, costo, tempo, rapporto };
        editIndex = null;
      } else {
        items.push({ nome, costo, tempo, rapporto });
      }

      items.sort((a, b) => a.rapporto - b.rapporto);
      saveToLocal();
      renderTable();
      form.reset();
    });

    function saveToLocal() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function renderTable() {
      tbody.innerHTML = '';
      items.forEach((item, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${item.nome}</td>
          <td>${item.costo.toLocaleString('it-IT', { maximumFractionDigits: 0 })}</td>
          <td>${item.tempo.toLocaleString('it-IT', { maximumFractionDigits: 0 })}</td>
          <td class="ratio">${(item.rapporto).toLocaleString('it-IT', { maximumFractionDigits: 0 })}</td>
          <td>
            <button class="btn-small btn-edit" onclick="editItem(${index})">Modifica</button>
            <button class="btn-small btn-delete" onclick="deleteItem(${index})">Rimuovi</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function editItem(index) {
      const item = items[index];
      document.getElementById('nome').value = item.nome;
      document.getElementById('costo').value = item.costo;
      document.getElementById('tempo').value = item.tempo;
      editIndex = index;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteItem(index) {
      if (confirm("Vuoi davvero rimuovere questo elemento?")) {
        items.splice(index, 1);
        saveToLocal();
        renderTable();
      }
    }
  </script>
</body>

</html>
