<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoC Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Lista Miglioramenti</h1>

  <form id="todoForm">
    <input type="text" id="nome" placeholder="Nome" required />
    <input type="number" id="costo" placeholder="Costo" required min="1" />
    <input type="number" id="tempo" placeholder="(h) Tempo Miglioramento" required min="1" />
    <button type="submit">Aggiungi</button>
  </form>

  <table id="todoTable">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Costo</th>
        <th>Tempo Miglioramento (h)</th>
        <th>Rapporto (Costo/Tempo)</th>
        <th>Azioni</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="script.js"></script>
</body>

</html>
